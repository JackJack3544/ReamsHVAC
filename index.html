    <!-- Static Structured Data for Instant Search Engine Ingestion -->
    <script type="application/ld+json">

      "@context": "https://schema.org",
      "@type": ["HVACBusiness", "HomeAndConstructionBusiness"],
      "@id": "https://reamshvac.com/#business",
      "name": "ReamsHVAC",
      "legalName": "Reams Heating & Air Conditioning Inc.",
      "url": "https://reamshvac.com",
      "telephone": "+1-800-555-0199",
      "email": "dispatch@reamshvac.com",
      "license": "CA C-20 #1048291",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "1250 S 10th St",
        "addressLocality": "San Jose",
        "addressRegion": "CA",
        "postalCode": "95112",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 37.3382,
        "longitude": -121.8863
      },
      "areaServed": ["San Jose", "Santa Clara", "Sunnyvale", "Campbell", "Cupertino", "Los Gatos", "Saratoga", "Milpitas", "Palo Alto", "Mountain View", "Fremont", "San Francisco"],

        "reviewCount": "524",
        "bestRating": "5",
        "worstRating": "1"
      }
    }
    </script>

  <body>

      <input type="email" name="email" />

    <form name="free-estimate" netlify netlify-honeypot="bot-field" hidden>

      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <textarea name="notes"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
